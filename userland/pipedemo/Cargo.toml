[package]
name = "pipedemo-user"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pipedemo"
path = "src/main.rs"
test = false
bench = false

[dependencies]
myos-userlib = { path = "../libmyos" }

# panic = "abort" comes from the workspace root's [profile.release] —
# cargo requires profile settings live only there, not in member crates.
